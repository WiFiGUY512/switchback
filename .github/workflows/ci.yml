name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Build the package
        run: uv build
      - name: Smoke test the command
        run: |
          uv run switchback --version
          uv run switchback check --no-dns --http-port 8080

  esphome:
    name: ESPHome configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Keep in step with release.yml
      - run: pip install esphome==2026.5.1
      - name: Validate every config
        working-directory: firmware/esphome
        run: |
          key=$(python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())")
          {
            echo "api_encryption_key: \"$key\""
            echo "ota_password: ci-only"
            echo "wifi_ssid: ci-only"
            echo "wifi_password: ci-only-pass"
          } > secrets.yaml
          for config in sbplug-portal.yaml sbplug-direct.yaml sbplug-implant.yaml; do
            esphome config "$config" > /dev/null
            echo "$config OK"
          done
          rm secrets.yaml

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx --from actionlint-py actionlint
