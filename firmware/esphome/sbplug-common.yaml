#==============================================================================
# Switchback bootstrap: shared by every payload (portal, direct, implant)
#==============================================================================
# The full hardware profile (plug-mini.yaml: relay, button, LEDs, power,
# voltage, current, energy) plus the defaults a fresh plug needs:
#
#   - a "Relay" switch, off after a power cut (relay_restore_mode)
#   - button: short press toggles the relay. Hold 10 s to factory reset,
#     which wipes Wi-Fi saved through the hotspot, so a portal plug offers it
#     again. The blue LED keeps its status pattern while you hold.
#   - a time source for Outlet Daily Energy (sntp)
#   - captive portal, and the project info Device Builder and Home Assistant
#     use to offer "Adopt"
#
# This file has no api, ota or wifi section. The payload files add those.
#
# SIZE LIMIT (for payloads the flasher writes):
#   The flasher writes from 0x0 and can only write 0x171000 (1,511,424) bytes,
#   so firmware.factory.bin has to stay under that. build_payload.py refuses
#   anything larger. Bluetooth is not in the bootstrap for this reason; add
#   addon-ble-proxy.yaml later over OTA.
#
# PARTITIONS:
#   A converted plug keeps the partition table from the image the flasher
#   wrote (ESPHome default for 4MB: two app slots). OTA never changes it.
#==============================================================================

substitutions:
  name: sbplug
  friendly_name: "SwitchBot Plug Mini"
  switchback_version: "0.4.0"
  relay_restore_mode: RESTORE_DEFAULT_OFF

packages:
  hardware: !include plug-mini.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: wifiguy512.switchback-plug-mini
    version: ${switchback_version}
  platformio_options:
    board_build.flash_mode: dio

dashboard_import:
  package_import_url: github://WiFiGUY512/switchback/firmware/esphome/sbplug-portal.yaml@v${switchback_version}
  import_full_config: false

# UART0 is what the serial pads expose, so boot logs show up on the recovery path.
logger:
  hardware_uart: UART0

captive_portal:

time:
  - platform: sntp
    id: sntp_time

switch:
  - platform: output
    id: relay
    name: "Relay"
    output: relay_output
    restore_mode: ${relay_restore_mode}

button:
  - platform: factory_reset
    id: factory_reset_button
    internal: true

script:
  - id: on_button_press
    then:
      - switch.toggle: relay

  # Runs at the 3 s mark. Still held 7 s later (10 s in all) = factory reset.
  - id: on_button_hold
    mode: single
    then:
      - delay: 7s
      - if:
          condition:
            binary_sensor.is_on: physical_button
          then:
            - button.press: factory_reset_button
