[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "switchback"
version = "0.4.0"
description = "Convert a SwitchBot Plug Mini to ESPHome over Wi-Fi and Bluetooth. No app, no cloud."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["COPYING"]
authors = [{ name = "Switchback contributors" }]
keywords = ["esphome", "switchbot", "home-assistant", "iot", "esp32-c3", "firmware", "ble"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=0.22",
    "zeroconf>=0.130",
]

[project.urls]
Homepage = "https://github.com/WiFiGUY512/switchback"
Issues = "https://github.com/WiFiGUY512/switchback/issues"
Changelog = "https://github.com/WiFiGUY512/switchback/blob/main/CHANGELOG.md"

[project.scripts]
switchback = "switchback.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.sdist]
include = ["src/switchback", "tests", "README.md", "CHANGELOG.md", "COPYING"]

[tool.hatch.build.targets.wheel]
packages = ["src/switchback"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["switchback", "conftest"]

[tool.mypy]
python_version = "3.10"
files = ["src/switchback"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["zeroconf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
